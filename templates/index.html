<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encurtador de Links</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <main>
        <h1>Encurtador de Links</h1>
        <p>Cole uma URL longa e receba um link curto.</p>

        <form id="formulario">
            <input type="url" id="campo-url" placeholder="https://exemplo.com/pagina-longa" required>
            <button type="submit">Encurtar</button>
        </form>

        <p id="resultado"></p>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
